name: CI

# Runs on every push to master and on pull requests targeting master.
# The commands mirror the "Build and run" section of README.md.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer run for the same branch or pull request supersedes an in-progress one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and ktlint
        run: ./gradlew :app:testDebugUnitTest ktlintCheck

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/**
          if-no-files-found: ignore
